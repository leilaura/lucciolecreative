:root {
  --night-top: #070c22;
  --night-mid: #0e1a44;
  --night-low: #24345f;
  --cream: #FEF1DE;
  --cream-soft: rgba(254, 241, 222, .78);
  --yellow: #FDD631;
  --serif: "ivybodoni", "Didot", "Bodoni 72", "Bodoni MT", "Times New Roman", serif;
  --display: "ivybodoni-condensed", "ivybodoni", "Didot", "Bodoni 72", "Times New Roman", serif;
  --label: "Montserrat", system-ui, sans-serif;
  --sans: "acumin-pro", "Montserrat", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100svh;
  background: linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 55%, var(--night-low) 100%);
  background-attachment: fixed;
  color: var(--cream);
  font-family: var(--sans);
  overflow-x: hidden;
}
canvas#sky {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.page {
  position: relative;
  min-height: 100svh;
  display: flex; flex-direction: column;
  padding: 28px 24px;
}
header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: inline-flex; border-radius: 50%; }
.logo { display: block; width: 76px; height: 76px; overflow: visible; }
/* Logo: nasce nel suo punto e cresce piano fino al 100%,
   poi galleggia leggermente, come le lucciole dello sfondo.
   scale, translate e rotate sono proprietà separate: si animano insieme senza conflitti. */
.logo {
  transform-origin: 50% 50%;
  scale: 0;
  animation:
    logoGrow 2s cubic-bezier(.22, 1, .36, 1) .2s forwards,
    logoBob 5.5s ease-in-out 2.2s infinite alternate both,
    logoSway 8s ease-in-out .2s infinite alternate both;
}
.logo-dot, .dot-glow, .dot-wrap { transform-box: fill-box; transform-origin: center; }
.dot-glow { opacity: .55; animation: glowPulse 3.2s ease-in-out 1.6s infinite; will-change: transform, opacity; }
.dot-wrap { transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
.brand:hover .dot-wrap { transform: scale(1.25); }
.brand:hover .dot-glow { opacity: 1; }
@keyframes logoGrow { from { scale: 0; } to { scale: 1; } }
@keyframes logoBob { from { translate: 0 0; } to { translate: 3px -6px; } }
@keyframes logoSway { from { rotate: -3deg; } to { rotate: 3deg; } }
@keyframes glowPulse {
  0%, 100% { opacity: .45; transform: scale(.85); }
  50% { opacity: 1; transform: scale(1.15); }
}
.ig {
  color: var(--cream-soft); font-size: 14px; text-decoration: none;
  padding: 10px 0;
}
.ig:hover { color: var(--cream); }

main {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  gap: 28px;
  padding: 56px 0;
}
.intro {
  margin: 0;
  max-width: 30ch;
  font-family: var(--serif);
  font-size: clamp(20px, 2.6vw, 26px);
  line-height: 1.35;
  color: var(--cream-soft);
  opacity: 0; animation: rise 1.6s ease .3s forwards;
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(48px, 6.5vw, 88px);
  line-height: 1.04;
  letter-spacing: 0;            /* come nel Reel: spaziatura e kerning originali del font */
  font-kerning: normal;
  opacity: 0; animation: rise 1.8s ease 1.4s forwards;
}
/* "da lontano": corsivo vero di IvyBodoni, più pieno come nel Reel */
h1 em {
  font-style: italic;
  font-weight: 600;             /* corsivo semibold per "da lontano." */
}
h1 .period { color: var(--yellow); text-shadow: 0 0 18px rgba(253, 214, 49, .7); }
.soon {
  margin: 8px 0 0;
  font-family: var(--label); font-weight: 500;
  font-size: 12px; line-height: 2; letter-spacing: .2em; text-transform: uppercase;
  color: var(--cream-soft);
  opacity: 0; animation: rise 1.6s ease 2.6s forwards;
}
.cta {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
  opacity: 0; animation: rise 1.6s ease 3s forwards;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: 0 24px;
  border-radius: 999px;
  font-size: 16px; font-weight: 600; text-decoration: none;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.btn-primary {
  background: var(--yellow); color: #0b1230;
  box-shadow: 0 0 0 0 rgba(253, 214, 49, 0);
}
.btn-primary:hover { box-shadow: 0 0 28px 4px rgba(253, 214, 49, .45); transform: translateY(-1px); }
.btn-ghost { color: var(--cream); border: 1.5px solid rgba(254, 241, 222, .55); }
.btn-ghost:hover { border-color: var(--cream); background: rgba(254, 241, 222, .06); }
.btn:focus-visible, .brand:focus-visible, .ig:focus-visible, footer a:focus-visible {
  outline: 2px solid var(--yellow); outline-offset: 4px;
}

footer {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
  font-size: 13px; color: var(--cream-soft);
}
footer a { color: var(--cream-soft); }

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
  to { opacity: 1; transform: none; filter: none; }
}
@media (prefers-reduced-motion: reduce) {
  .intro, h1, .soon, .cta { animation: none; opacity: 1; }
  .logo, .dot-glow { animation: none; }
  .logo { scale: 1; }
  .dot-glow { opacity: .8; }
}
@media (max-width: 520px) {
  .page { padding: 20px 16px; }
  .logo { width: 60px; height: 60px; }
  .cta { flex-direction: column; width: 100%; max-width: 320px; }
}
</style>
</head>

<script>
(function () {
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, specks = [], fireflies = [], glowers = [];
  var mouse = { x: -9999, y: -9999, active: false };

  function rand(a, b) { return a + Math.random() * (b - a); }

  function build() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var area = W * H;
    var nSpecks = Math.round(Math.min(220, Math.max(70, area / 6500)));
    specks = [];
    for (var i = 0; i < nSpecks; i++) {
      specks.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(.5, 1.6),
        base: rand(.25, .85),
        tw: rand(.4, 1.6), ph: rand(0, Math.PI * 2),
        vx: rand(-.08, .08), vy: rand(-.12, .04),
        blur: Math.random() < .12
      });
    }
    // lucine luminose: meno dei puntini, ma con alone, come nel Reel
    var nGlow = W < 600 ? 7 : 14;
    glowers = [];
    for (var g = 0; g < nGlow; g++) {
      glowers.push({
        x: rand(0, W), y: rand(0, H),
        vx: rand(-.18, .18), vy: rand(-.22, .06),
        core: rand(1.1, 2),
        halo: rand(14, 32),
        ph: rand(0, Math.PI * 2), sp: rand(.35, 1.1),
        wob: rand(.3, .9)
      });
    }
    var nFlies = W < 600 ? 2 : 3;
    fireflies = [];
    for (var j = 0; j < nFlies; j++) {
      fireflies.push({
        x: rand(W * .15, W * .85), y: rand(H * .15, H * .85),
        a: rand(0, Math.PI * 2), speed: rand(.25, .5),
        turn: rand(.004, .012), ph: rand(0, Math.PI * 2),
        swarm: Array.from({ length: 7 }, function () {
          return { a: rand(0, Math.PI * 2), d: rand(14, 46), s: rand(.006, .02), r: rand(.8, 1.8) };
        })
      });
    }
  }

  function glow(x, y, radius, alpha) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, 'rgba(253,214,49,' + alpha + ')');
    g.addColorStop(.35, 'rgba(253,214,49,' + alpha * .28 + ')');
    g.addColorStop(1, 'rgba(253,214,49,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
  }

  function dot(x, y, r, alpha) {
    ctx.fillStyle = 'rgba(255,224,110,' + alpha + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function frame(t) {
    var time = t / 1000;
    ctx.clearRect(0, 0, W, H);

    // cursor glow
    if (mouse.active) glow(mouse.x, mouse.y, 220, .16);

    // background specks
    for (var i = 0; i < specks.length; i++) {
      var s = specks[i];
      if (!reduce) {
        s.x += s.vx; s.y += s.vy;
        if (s.y < -10) { s.y = H + 10; s.x = rand(0, W); }
        if (s.x < -10) s.x = W + 10; else if (s.x > W + 10) s.x = -10;
      }
      var a = reduce ? s.base : s.base * (.55 + .45 * Math.sin(time * s.tw + s.ph));
      if (mouse.active) {
        var dx = s.x - mouse.x, dy = s.y - mouse.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 40000) a = Math.min(1, a + (1 - d2 / 40000) * .6);
      }
      if (s.blur) glow(s.x, s.y, s.r * 9, a * .35);
      else dot(s.x, s.y, s.r, a);
    }

    // medium bright fireflies: drift slowly, breathe on and off
    for (var gi = 0; gi < glowers.length; gi++) {
      var gl = glowers[gi];
      if (!reduce) {
        gl.x += gl.vx + Math.sin(time * gl.wob + gl.ph) * .15;
        gl.y += gl.vy + Math.cos(time * gl.wob * .8 + gl.ph) * .12;
        if (gl.y < -60) { gl.y = H + 60; gl.x = rand(0, W); }
        if (gl.y > H + 60) gl.y = -60;
        if (gl.x < -60) gl.x = W + 60; else if (gl.x > W + 60) gl.x = -60;
      }
      var b = reduce ? .8 : .5 + .5 * Math.sin(time * gl.sp + gl.ph);
      b = b * b * (3 - 2 * b); // smoothstep: più tempo spente o accese, transizioni morbide
      if (b > .03) {
        glow(gl.x, gl.y, gl.halo * (.8 + .2 * b), .3 * b);
        glow(gl.x, gl.y, gl.core * 4, .75 * b);
        dot(gl.x, gl.y, gl.core, Math.min(1, .3 + b));
      }
    }

    // big wandering fireflies with a small swarm
    for (var j = 0; j < fireflies.length; j++) {
      var f = fireflies[j];
      if (!reduce) {
        f.a += Math.sin(time * .7 + f.ph) * f.turn * 3;
        f.x += Math.cos(f.a) * f.speed;
        f.y += Math.sin(f.a) * f.speed;
        var m = 60;
        if (f.x < m || f.x > W - m) f.a = Math.PI - f.a;
        if (f.y < m || f.y > H - m) f.a = -f.a;
        f.x = Math.max(m, Math.min(W - m, f.x));
        f.y = Math.max(m, Math.min(H - m, f.y));
      }
      var pulse = reduce ? 1 : .75 + .25 * Math.sin(time * 1.3 + f.ph);
      glow(f.x, f.y, 140 * pulse, .32 * pulse);
      glow(f.x, f.y, 26, .9);
      dot(f.x, f.y, 3.2, 1);
      for (var k = 0; k < f.swarm.length; k++) {
        var p = f.swarm[k];
        if (!reduce) p.a += p.s;
        var px = f.x + Math.cos(p.a) * p.d, py = f.y + Math.sin(p.a * 1.3) * p.d * .7;
        dot(px, py, p.r, .55 + .4 * Math.sin(time * 2 + k));
      }
    }

    if (!reduce) requestAnimationFrame(frame);
  }

  window.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; }
  });
  document.addEventListener('pointerleave', function () { mouse.active = false; });
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { build(); if (reduce) frame(0); }, 150);
  });

  build();
  requestAnimationFrame(frame);
})();
</script>
